name: Build and Deploy Spring Boot to Azure

on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
          cache: maven

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Read DB Password from Key Vault
        run: |
          DB_PASSWORD=$(az keyvault secret show \
            --vault-name order-demo-kv-2026 \
            --name db-password \
            --query value \
            --output tsv)

          echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV
          
#      - name: Verify DB Password
#        run: |
#          if [ -z "$DB_PASSWORD" ]; then
#            echo "DB_PASSWORD is empty"
#            exit 1
#          else
#            echo "DB_PASSWORD is available"
#          fi

      - name: Build with Maven
        run: mvn clean package

      - name: Build Docker image
        run: |
          docker build \
            -t orderdemoregistry2026.azurecr.io/order-service:${{ github.sha }} \
            .

      - name: Login to Azure Container Registry
        run: |
          az acr login --name orderdemoregistry2026

      - name: Push Docker image to ACR
        run: |
          docker push orderdemoregistry2026.azurecr.io/order-service:${{ github.sha }}

      - name: Deploy Docker image to Azure App Service
        run: |
          az webapp config container set \
            --resource-group rg-order-demo \
            --name order-demo-container-2026 \
            --docker-custom-image-name orderdemoregistry2026.azurecr.io/order-service:${{ github.sha }} \
            --docker-registry-server-url https://orderdemoregistry2026.azurecr.io

      

  
