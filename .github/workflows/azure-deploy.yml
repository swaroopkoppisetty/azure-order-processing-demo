name: Build and Deploy Spring Boot to Azure

on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
          cache: maven

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Read DB Password from Key Vault
        run: |
          DB_PASSWORD=$(az keyvault secret show \
            --vault-name order-demo-kv-2026 \
            --name db-password \
            --query value \
            --output tsv)

          echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV
          
      - name: Verify DB Password
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "DB_PASSWORD is empty"
            exit 1
          else
            echo "DB_PASSWORD is available"
          fi

      - name: Build with Maven
        run: mvn clean package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: target/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: target

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: order-demo-app-2026
          package: target/*.jar