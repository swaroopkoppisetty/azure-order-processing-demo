spring.application.name=order-service

spring.datasource.url=jdbc:sqlserver://order-demo-sqlserver.database.windows.net:1433;database=orderdb;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;

spring.datasource.username=sqladmin
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.docker.compose.enabled=false

azure.servicebus.namespace=order-demo-servicebus-2026.servicebus.windows.net
azure.servicebus.topic=order-events
azure.servicebus.enabled=false